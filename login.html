<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — SprinterPlus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,system-ui,-apple-system,sans-serif}</style>
</head>
<body class="bg-white text-zinc-900">
  <main class="max-w-md mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">Login or Register</h1>
    <form id="login-form" class="space-y-3">
      <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded">
      <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded">
      <div class="flex gap-3">
        <button id="login-btn" class="px-4 py-2 bg-sky-500 text-white rounded">Login</button>
        <button id="register-btn" type="button" class="px-4 py-2 border rounded">Register</button>
      </div>
    </form>
    <p class="text-zinc-500 text-sm mt-4">Wellcome <strong> in</strong> / <strong>Store</strong></p>
  </main>

  <script>
    // Ensure default admin user exists
    (function(){
      const users = JSON.parse(localStorage.getItem('users')||'[]');
      if(!users.find(u=>u.email==='admin@sprinter.com')){
        users.push({email:'admin@sprinter.com', password:'admin123', name:'Admin', role:'admin'});
        localStorage.setItem('users', JSON.stringify(users));
      }
    })();

    function getUsers(){return JSON.parse(localStorage.getItem('users')||'[]')}
    function saveUsers(u){localStorage.setItem('users', JSON.stringify(u))}

    function getParam(name){const url = new URL(location.href); return url.searchParams.get(name)}

    document.getElementById('login-btn').addEventListener('click', (e)=>{
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const users = getUsers();
      const u = users.find(x=>x.email===email && x.password===password);
      if(!u){ alert('Invalid credentials'); return; }
      localStorage.setItem('auth', JSON.stringify({email:u.email, name:u.name, role:u.role}));
      const redirect = getParam('redirect') || 'index.html';
      location.href = redirect;
    });

    document.getElementById('register-btn').addEventListener('click', ()=>{
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if(!email || !password){ alert('Enter email and password'); return; }
      const users = getUsers();
      if(users.find(u=>u.email===email)){ alert('User exists, please login'); return; }
      const name = email.split('@')[0];
      users.push({email, password, name, role:'customer'}); saveUsers(users);
      alert('Registered — you can now login');
    });
  </script>
</body>
</html>
