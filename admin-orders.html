<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,system-ui,-apple-system,sans-serif}</style>
</head>
<body class="bg-white text-zinc-900">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-zinc-100">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-[72px] gap-4">
        <a href="index.html" class="flex items-center gap-2 shrink-0">
          <div class="w-9 h-9 bg-zinc-900 rounded-xl grid place-items-center"><i data-lucide="truck" class="w-5 h-5 text-white"></i></div>
          <span class="text-[22px] font-extrabold tracking-tight">SPRINTER<span class="text-sky-500">PLUS</span></span>
        </a>
        <div class="flex items-center gap-3">
          <a href="admin.html" class="text-sm text-zinc-600">Admin</a>
          <a href="cart.html" class="text-sm text-zinc-600">Cart</a>
          <a href="index.html" class="text-sm text-zinc-600">Store</a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-[1000px] mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">Orders (Admin)</h1>
    <div id="orders-list" class="space-y-4"></div>
    <div class="mt-6">
      <button id="clear-orders" class="px-4 py-2 border rounded">Clear all orders</button>
    </div>
  </main>

  <script>
    // Auth protection (client-side)
    const _auth = JSON.parse(localStorage.getItem('auth')||'null');
    if(!_auth || _auth.role !== 'admin'){
      alert('Please login as admin to access this page');
      location.href = 'login.html?redirect=admin-orders.html';
    }

    function getOrders(){ return JSON.parse(localStorage.getItem('orders')||'[]'); }
    function saveOrders(o){ localStorage.setItem('orders', JSON.stringify(o)); }

    function render(){
      const orders = getOrders(); const list = document.getElementById('orders-list'); list.innerHTML='';
      if(!orders.length){ list.innerHTML = '<div class="text-zinc-600">No orders yet.</div>'; return; }
      orders.slice().reverse().forEach(order=>{
        const el = document.createElement('div'); el.className='border rounded-2xl p-4 bg-white flex flex-col gap-3';
        el.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="font-semibold">Order #${order.id}</div>
              <div class="text-sm text-zinc-500">${new Date(order.created).toLocaleString()}</div>
            </div>
            <div class="text-sm">Status: <strong>${order.status}</strong></div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <div class="font-semibold">Customer</div>
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-sky-50 text-sky-700 grid place-items-center font-bold">${order.avatarInitials|| (order.name||'').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase()}</div>
                <div>
                  <div>${order.name} <span class="text-xs text-zinc-500">— ${order.email}</span></div>
                  <div class="text-xs mt-1">
                    <span class="inline-block px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-700 mr-2">${order.customerTier || 'Bronze'}</span>
                    <span class="text-zinc-500">Orders: ${order.customerPrevOrders||0}</span>
                  </div>
                </div>
              </div>
              <div class="text-zinc-600 mt-2">${order.phone || ''}</div>
              <div class="text-zinc-600 mt-2">${order.address || ''}</div>
            </div>
            <div>
              <div class="font-semibold">Items</div>
              <div class="space-y-2 mt-2">
                ${order.items.map(i=>`<div class="flex items-center justify-between"><div>${i.name} x ${i.qty}</div><div>€${((i.price||0)*i.qty).toFixed(2)}</div></div>`).join('')}
              </div>
              <div class="mt-3 text-right font-bold">Subtotal: €${(order.subtotal||0).toFixed(2)}</div>
              <div class="text-right text-sm text-zinc-600">Discount: ${order.discountPercent||0}% — Final: €${(order.totalAfterDiscount||order.subtotal||0).toFixed(2)}</div>
            </div>
          </div>
          <div class="flex gap-2">
            <button data-id="${order.id}" class="mark-processed px-3 py-2 bg-emerald-500 text-white rounded">Toggle processed</button>
            <button data-id="${order.id}" class="delete-order px-3 py-2 border rounded">Delete</button>
            <button data-email="${order.email}" class="view-history px-3 py-2 border rounded">View history</button>
          </div>
          <div class="customer-history hidden mt-3 p-3 bg-zinc-50 rounded">Loading...</div>`;
        list.appendChild(el);
      });

      document.querySelectorAll('.view-history').forEach(b=>b.addEventListener('click', e=>{
        const email = e.currentTarget.dataset.email; const card = e.currentTarget.closest('div.border'); const hist = card.querySelector('.customer-history');
        if(!hist) return; if(!hist.classList.contains('hidden')){ hist.classList.add('hidden'); return; }
        const all = getOrders(); const related = all.filter(o=>o.email===email).sort((a,b)=>b.created?new Date(b.created)-new Date(a.created):b.id-a.id);
        const total = related.reduce((s,o)=>s + (o.totalAfterDiscount!==undefined?o.totalAfterDiscount:(o.subtotal||0)),0);
        hist.innerHTML = `<div class="text-sm mb-2 font-semibold">Total spent: €${total.toFixed(2)} — Orders: ${related.length}</div>` +
          related.map(o=>`<div class="py-2 border-t first:border-t-0 text-sm"><div class="font-medium">#${o.id} • ${new Date(o.created).toLocaleString()}</div><div class="text-zinc-600">Status: ${o.status} • €${(o.totalAfterDiscount||o.subtotal||0).toFixed(2)}</div></div>`).join('');
        hist.classList.remove('hidden');
      }));

      document.querySelectorAll('.mark-processed').forEach(b=>b.addEventListener('click', e=>{
        const id = +e.currentTarget.dataset.id; const orders = getOrders(); const o = orders.find(x=>x.id===id); if(!o) return; o.status = o.status==='new'?'processed':'new'; saveOrders(orders); render();
      }));

      document.querySelectorAll('.delete-order').forEach(b=>b.addEventListener('click', e=>{
        const id = +e.currentTarget.dataset.id; if(!confirm('Delete order?')) return; let orders = getOrders(); orders = orders.filter(x=>x.id!==id); saveOrders(orders); render();
      }));
    }

    document.getElementById('clear-orders').addEventListener('click', ()=>{ if(confirm('Clear all orders?')){ localStorage.removeItem('orders'); render(); } });

    render(); if(window.lucide) lucide.replace();
  </script>
</body>
</html>
